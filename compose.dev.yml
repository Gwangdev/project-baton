# 로컬 평문 HTTP overlay: docker compose -f compose.yml -f compose.dev.yml up
# 프록시는 인증서 없이 loopback에서 HTTP를 내주고, API는 여기서만 Secure 쿠키 플래그를 끈다(README §4.1은 운영에서
# Secure를 유지한다). 격리는 그대로다: 같은 사용자, 읽기 전용 파일 시스템, 같은 네트워크.
services:
  app:
    user: "10001:10001"
    read_only: true
    environment:
      BATON_SESSION_COOKIE_SECURE: "false"
      # 합성 데이터라서 작업 메타데이터와 로그인 주소 보존(README §8)을 여기서는 켜고 compose.yml에서는 끈다.
      BATON_RETENTION_JOBS_ENABLED: "true"
      BATON_RETENTION_AUDIT_ENABLED: "true"

  proxy:
    user: "10002:10002"
    read_only: true
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.dev", "--adapter", "caddyfile"]
    ports: !override
      - "127.0.0.1:${BATON_PROXY_PORT:-8080}:8080"
    volumes: !reset []

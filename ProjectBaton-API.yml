  /projects/{projectId}/connections:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [connections]
      operationId: listSourceConnections
      summary: 프로젝트 연동 목록과 상태 조회
      description: |
        FR-19·FR-21·FR-22.
        S06은 자신이 연결한 클라우드 업무 폴더를, S12는 프로젝트 공용 연동까지 함께 조회한다.
      parameters:
        - name: channel
          in: query
          required: false
          description: 채널 필터
          schema:
            $ref: '#/components/schemas/SourceChannel'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 연동 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceConnectionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [connections]
      operationId: createSourceConnection
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      summary: 승인된 클라우드 업무 폴더 연결
      description: |
        FR-21. 회사가 승인한 저장소의 폴더만 연결한다.
        개인 PC 폴더 감시나 데스크톱 에이전트는 사용하지 않는다.
        원본 저장소의 권한은 변경하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceConnectionRequest'
      responses:
        '201':
          description: 생성된 연동
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceConnection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /connections/{connectionId}:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    get:
      tags: [connections]
      operationId: getSourceConnection
      summary: 연동 상세와 마지막 수집 결과 조회
      description: 연결 상태, 수집 상태, 마지막 수집 시각과 최근 수집 결과를 반환한다.
      responses:
        '200':
          description: 연동 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceConnectionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [connections]
      operationId: updateSourceConnection
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      summary: 연동 표시명·대상 변경과 일시 중지·재개·해제
      description: |
        D11. 시스템 관리자는 모든 연동을, 일반 사용자는 자신이 연결한 폴더만 변경할 수 있다.
        `status`를 DISCONNECTED로 바꾸는 것이 해제이며 수집된 기록은 삭제되지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSourceConnectionRequest'
      responses:
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          description: 변경된 연동
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceConnection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [connections]
      operationId: deleteSourceConnection
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      summary: 연동 설정 삭제
      description: |
        오생성 취소용이다. 이 연동에서 수집된 문서가 하나도 없을 때만 지운다.
        수집된 문서가 있으면 409로 거부한다. 그 문서들이 기록의 원문 근거이기 때문이다.
        이미 수집한 연동을 그만 쓰려면 PATCH status=DISCONNECTED 로 해제한다.
        해제는 수집된 기록을 지우지 않는다.
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '204':
          description: 삭제되었다. 본문 없음.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReferenceConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /connections/{connectionId}/reconnect:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    post:
      tags: [connections]
      operationId: reconnectSourceConnection
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      summary: 연동 재연결
      description: 인증 만료나 실패 상태의 연동을 다시 연결하고 상태를 ACTIVE로 되돌린다.
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: 재연결된 연동
          content:
            application/json:

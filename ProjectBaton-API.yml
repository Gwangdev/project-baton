      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: 오류가 발생한 필드 경로
        message:
          type: string
          description: 오류 사유

    PageMeta:
      type: object
      description: 목록 응답의 공통 페이지 정보
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          minimum: 0
          description: 조건에 맞는 전체 건수
        limit:
          type: integer
          description: 이번 응답의 최대 건수
        offset:
          type: integer
          minimum: 0
          description: 건너뛴 건수
        nextCursor:
          type: string
          nullable: true
          maxLength: 1000


openapi: 3.0.3

info:
  title: Project Baton API
  description: |
    사내 프로젝트 인수인계 서비스의 화면 기반 REST 계약이다.

    범위는 `DAY1_서비스_기획_확정안.md`의 FR-01~FR-22와 화면 S01~S12이며,
    엔티티와 필드는 `ProjectBaton-DB.dbml`, `화면별_표시필드표.md`와 일치한다.

    설계 원칙
    - AI 결과는 자동 확정하지 않는다. 신뢰 상태는 AUTO_DRAFT · CONFIRMED · CORRECTED · DISMISSED 네 가지다.
    - 느린 작업(패키지 생성)은 202 Accepted로 접수하고 상태 조회로 확인한다.
    - AI 또는 수집이 실패해도 기록 조회 경로는 계속 동작한다.
    - 영구 삭제 대신 비활성화와 연동 해제를 기본 동작으로 사용한다.

    인증은 사내 계정 로그인(`POST /auth/sign-in`)이 만드는 세션 쿠키(`cookieAuth`)이고, 상태를 바꾸는 요청은
    `GET /auth/csrf`로 받은 CSRF 토큰을 헤더에 함께 보낸다.
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://baton.internal.example/api/v1
    description: 사내 단일 테넌트 배포

security:
  - cookieAuth: []

x-fr-requirements:
  FR-01: [signIn, signOut, getCsrfToken, getCurrentUser, listProjects, setCredential]
  FR-02: [listRecords, getRecord, getProject]
  FR-03: [listRecords, getRecord, createRecordRelation]
  FR-04: [listCollectedFiles, createManualDraft, retrySourceProcessing]
  FR-05: [listCollectedFiles, createManualDraft, retrySourceProcessing]
  FR-06: [reviewRecord, listRecords]
  FR-07: [listPersonalNotes, createPersonalNote, sharePersonalNoteSummary]
  FR-08: [listPersonalNotes, createPersonalNote, sharePersonalNoteSummary]
  FR-09: [reviewRecord, listRecords]
  FR-10: [requestHandover, listHandovers, getHandover, regenerateHandover]
  FR-11: [requestHandover, listHandovers, getHandover, regenerateHandover]
  FR-12: [resolveHandoverItem, createRecordRelation]
  FR-13: [decideHandoverCompletion, acknowledgeHandoverItem]
  FR-14: [listHandoverItems, getHandover, retryHandoverGeneration]
  FR-15: [askQuestion, listQuestions]
  FR-16: [askQuestion, listQuestions]
  FR-17: [getAssessment, submitAssessmentAttempt]
  FR-18: [listOrganizations, createOrganization, updateOrganization, deleteOrganization, listUsers, createUser, issueCredentialToken, updateUser, deleteUser, listAllProjects, createProject, updateProject, deleteProject, listProjectMembers, addProjectMember, updateProjectMember, deleteProjectMember]
  FR-19: [listSourceConnections, createSourceConnection, getSourceConnection, updateSourceConnection, deleteSourceConnection, reconnectSourceConnection, listCollectedFiles, retrySourceProcessing]
  FR-20: [getDashboard, listProjects, listRecords]
  FR-21: [createSourceConnection, updateSourceConnection, reconnectSourceConnection, listCollectedFiles, createManualDraft]
  FR-22: [listSourceConnections, getSourceConnection, getDashboard]

tags:
  - name: auth
    description: S01 사내 계정 로그인과 로그아웃
  - name: dashboard
    description: S02 프로젝트 대시보드의 요약 정보
  - name: projects
    description: S02·S03 프로젝트 목록과 상세
  - name: records
    description: S03·S04·S05 프로젝트 기록의 조회와 확인
  - name: notes
    description: S06 빠른 메모의 비공개 저장과 선택 요약 공유
  - name: connections
    description: S06·S12 기록 수집 연동의 연결과 상태
  - name: handovers
    description: S07·S08·S11 담당자 교체와 인수인계 패키지
  - name: qa
    description: S09 근거 기반 질의응답
  - name: assessments
    description: S10 업무 준비도 확인
  - name: admin
    description: S12 사용자·조직·프로젝트·역할 관리

paths:

  /auth/sign-in:
    post:
      tags: [auth]
      operationId: signIn
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      summary: 사내 계정 로그인
      description: |
        FR-01. 사내 계정과 비밀번호로 인증하고 접근 가능한 프로젝트를 함께 반환한다.
        비밀번호는 저장하지 않고 해시로만 대조한다.
        비활성화된 계정은 자격증명이 맞아도 403으로 거절한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: 인증된 사용자와 참여 프로젝트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/sign-out:
    post:
      tags: [auth]
      operationId: signOut
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      summary: 로그아웃
      description: 현재 세션을 종료한다. 이미 만료된 세션이어도 성공으로 처리한다.
      responses:
        '204':
          description: 종료됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/credentials:
    post:
      tags: [auth]
      operationId: setCredential
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      summary: 설정 코드로 비밀번호 정하기
      description: |
        관리자가 발급한 일회용 설정 코드로 본인의 비밀번호를 정한다(README §4.1). 처음 정하는 경우와 분실 뒤 재설정이
        같은 경로다. 성공하면 204이고 자동 로그인하지 않는다. 그 사용자의 기존 세션은 모두 종료된다.
        없는 사번, 틀린 코드, 만료된 코드, 이미 쓴 코드, 다른 사용자의 코드는 모두 같은 400 INVALID_CREDENTIAL_TOKEN이라
        계정이 있는지 알 수 없다. 비밀번호가 규칙(12~128자, 사번과 다름)을 어기면 400 INVALID_INPUT이고 코드는 쓰이지
        않는다. 로그인과 같은 실패 제한(5회/5분)이 적용되어 넘으면 429다. Idempotency-Key는 받지 않는다. 코드를 한 번
        쓰면 끝나는 것이 멱등 장치다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCredentialRequest'
      responses:
        '204':
          description: 비밀번호가 정해졌다.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrfToken
      summary: 상태 변경용 CSRF 토큰 조회
      security: []
      responses:
        '200':
          description: Cache-Control no-store로 반환하는 CSRF 토큰
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me:
    get:
      tags: [dashboard]
      operationId: getCurrentUser
      summary: 현재 사용자와 참여 프로젝트 역할 조회
      description: 전 화면 상단에 표시하는 Actor 이름·직급과 프로젝트별 역할을 반환한다.
      responses:
        '200':
          description: 현재 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: 대시보드 요약 조회
      description: |
        S02의 요약 카드와 프로젝트 목록을 반환한다.
        연동 상태는 FR-22에 따라 일반 사용자에게는 참여 프로젝트만, 시스템 관리자에게는 전체가 보인다.
      responses:
        '200':
          description: 대시보드 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: 접근 가능한 프로젝트 목록 조회
      description: FR-01에 따라 자신에게 권한이 부여된 프로젝트만 반환한다.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 프로젝트 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: getProject
      summary: 프로젝트 상세 조회
      description: S03 상단의 프로젝트 요약과 구성원 역할을 반환한다.
      responses:
        '200':
          description: 프로젝트 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: listCurrentProjectMembers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      summary: 프로젝트 현재 구성원 조회
      description: 그 프로젝트의 현재 구성원(배정이 시작됐고 끝나지 않았으며 사용자와 조직이 활성)만 돌려준다. 읽는 사람도 그 프로젝트의 현재 구성원이어야 하고, 아니면 다른 프로젝트 조회와 같이 404다. 담당자 교체 요청에서 기존·신규 담당자를 고를 때 쓴다(FR-10). 시스템 관리자용 목록(listProjectMembers)과 달리 종료된 배정을 담지 않는다.
      responses:
        '200':
          description: 현재 구성원 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{projectId}/records:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [records]
      operationId: listRecords
      summary: 프로젝트 기록 목록 조회
      description: |
        S03 타임라인과 S04 확인 대기 기록함이 함께 사용한다.
        개인 연결에서 수집된 AUTO_DRAFT 기록은 연결한 사용자에게만 반환한다.
      parameters:
        - name: recordType
          in: query
          required: false
          description: 기록 유형 필터. 여러 값을 반복해서 전달할 수 있다.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RecordType'
          style: form
          explode: true
        - name: trustStatus
          in: query
          required: false
          description: 신뢰 상태 필터. 여러 값을 반복해서 전달할 수 있다.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RecordTrustStatus'
          style: form
          explode: true
        - name: occurredFrom
          in: query
          required: false
          description: 발생일 시작 (포함)
          schema:
            type: string
            format: date
        - name: occurredTo
          in: query
          required: false
          description: 발생일 종료 (포함)
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 기록 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /records/{recordId}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      tags: [records]
      operationId: getRecord
      summary: 기록 상세 조회
      description: S05 좌측 원문과 우측 AI 추출 결과, 수정 이력과 대체·충돌 관계를 함께 반환한다.
      responses:
        '200':
          description: 기록 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /records/{recordId}/review:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    post:
      tags: [records]
      operationId: reviewRecord
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      summary: 기록 승인·수정 후 승인·제외
      description: |
        FR-06의 확인 행동이다.
        `CONFIRM`은 상태를 CONFIRMED로, `CORRECT`는 CORRECTED로 바꾸고 수정 이력 한 건을 남긴다.
        `DISMISS`는 DISMISSED로 바꾼다. 이미 확정된 기록을 다시 확인하면 409를 반환한다.
        `CORRECT`의 ownerUserId가 이 프로젝트의 현재 구성원이 아니면 400이고 errors에 필드 이름이 담긴다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRecordRequest'
      responses:
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          description: 확인 후 기록 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /projects/{projectId}/notes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [notes]
      operationId: listPersonalNotes
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      summary: 내 빠른 메모 목록 조회
      description: 작성자 본인의 메모만 반환한다. 공유 이력은 파생 기록의 코드 목록으로 표시한다.
      responses:
        '200':
          description: 메모 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalNoteList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [notes]
      operationId: createPersonalNote
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      summary: 빠른 메모 비공개 저장
      description: FR-07·FR-08. 저장된 원본은 어떤 경우에도 프로젝트에 노출되지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonalNoteRequest'
      responses:
        '409':
          $ref: '#/components/responses/Conflict'
        '201':
          description: 저장된 메모
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalNote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /notes/{noteId}/share:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    post:
      tags: [notes]
      operationId: sharePersonalNoteSummary
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      summary: 메모의 선택 요약을 프로젝트 기록으로 공유
      description: |
        원본 저장과 분리된 경로다. 사용자가 직접 고른 요약과 기록 유형만 전달한다.
        응답은 새로 생성된 CONFIRMED 기록이며 AUTO_DRAFT 검토 단계를 거치지 않는다.
        원본 메모의 공개 범위는 바뀌지 않는다.
        ownerUserId가 이 프로젝트의 현재 구성원이 아니면 400이고 errors에 필드 이름이 담긴다.
      requestBody:
        required: true

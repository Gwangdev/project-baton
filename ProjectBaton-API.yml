        FR-15·FR-16.
        확인된 기록에서 근거를 찾으면 answerStatus는 ANSWERED이고 citations가 채워진다.
        근거가 없으면 NO_EVIDENCE와 함께 추가 확인 대상을 반환하며 추측 답변을 만들지 않는다.
        AI 처리 자체가 실패하면 FAILED를 반환하되 기록 조회 경로는 영향을 받지 않는다.

      summary: 수집된 파일·문서 목록 조회
      description: |
        FR-21. S06 프로젝트 폴더 탭의 파일 목록이다.
        각 항목에는 그 파일에서 생성된 기록 후보의 코드가 함께 담긴다.
        개인 연결의 목록은 연결한 사용자만 조회할 수 있다.
      parameters:

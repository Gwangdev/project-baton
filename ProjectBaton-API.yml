        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReferenceConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{userId}/credential-tokens:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [admin]
      operationId: issueCredentialToken
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      summary: 초기 설정 코드 발급
      description: |
        FR-18, README §4.1. 시스템 관리자가 활성 LOCAL 계정에 일회용 설정 코드를 발급한다. 코드는 256비트 난수이고
        **이 응답에만 평문으로 나간다.** 서버에는 해시만 남는다. 유효 시간은 기본 24시간이며 다시 발급하면 이전 코드는
        무효다. 비활성 사용자, LOCAL이 아닌 계정, 시스템 관리자 계정은 409다(관리자의 비밀번호는 운영자가 재설정한다). Idempotency-Key는 받지 않는다. 멱등 재전송은 응답 본문을
        저장하는데 그 본문이 평문 코드이기 때문이다.
      responses:
        '201':
          description: 발급된 코드와 만료 시각
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/projects:
    get:
      tags: [admin]
      operationId: listAllProjects
      summary: 전체 프로젝트 목록 조회
      description: FR-18·FR-22. 시스템 관리자는 참여 여부와 무관하게 전체를 조회한다.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 프로젝트 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [admin]
      operationId: createProject
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      summary: 프로젝트 생성
      description: FR-18.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: 생성된 프로젝트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    patch:
      tags: [admin]
      operationId: updateProject
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      summary: 프로젝트 수정 또는 비활성화
      description: 수행 상태와 별개로 isActive를 false로 바꿔 비활성화한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          description: 갱신된 프로젝트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [admin]
      operationId: deleteProject
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      summary: 프로젝트 삭제
      description: |
        오생성 취소용이다. 구성원·기록·연동·인수인계가 없을 때만 지운다.
        참조가 하나라도 남아 있으면 409로 거부하고 무엇이 막는지 알려준다.
        이미 업무에 쓰인 대상은 비활성화(PATCH isActive=false)로 감춘다.
        확인자를 지우면 기록이 왜 믿을 만한지 설명할 수 없게 되기 때문이다.
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '204':
          description: 삭제되었다. 본문 없음.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReferenceConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [admin]
      operationId: listProjectMembers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      summary: 프로젝트 구성원과 역할 조회
      description: FR-18.
      responses:
        '200':
          description: 구성원 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [admin]
      operationId: addProjectMember
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      summary: 프로젝트 구성원 배정
      description: 한 사용자가 한 프로젝트에서 두 역할을 겸하면 409를 반환한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberUpsertRequest'
      responses:
        '201':
          description: 배정된 구성원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/projects/{projectId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/MemberId'
    patch:
      tags: [admin]
      operationId: updateProjectMember
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      summary: 구성원 역할 변경 또는 배정 종료
      description: 배정 종료는 leftOn을 설정한다. 행을 삭제하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberUpdateRequest'
      responses:
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          description: 갱신된 구성원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [admin]
      operationId: deleteProjectMember
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      summary: 구성원 배정 삭제
      description: |
        오생성 취소용이다. 그 구성원이 확인한 기록이 없을 때만 지운다.
        참조가 하나라도 남아 있으면 409로 거부하고 무엇이 막는지 알려준다.
        이미 업무에 쓰인 대상은 비활성화(PATCH isActive=false)로 감춘다.
        확인자를 지우면 기록이 왜 믿을 만한지 설명할 수 없게 되기 때문이다.
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '204':
          description: 삭제되었다. 본문 없음.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReferenceConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: BATON_SESSION
      description: Spring Security JDBC 세션 쿠키. 브라우저 JavaScript는 값을 읽지 않는다.

  headers:
    ETag:
      description: 응답 자원의 낙관적 잠금 버전
      required: true
      schema:
        type: string
        pattern: '^"[0-9]+"$'

  parameters:
    CsrfTokenHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema: {type: string, minLength: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
    ProjectId:
      name: projectId
      in: path
      required: true
      description: 프로젝트 식별자
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
    RecordId:
      name: recordId
      in: path
      required: true
      description: 프로젝트 기록 식별자
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
    NoteId:
      name: noteId
      in: path
      required: true
      description: 빠른 메모 식별자
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
    ConnectionId:
      name: connectionId
      in: path
      required: true
      description: 연동 식별자
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
    RelationId:
      name: relationId
      in: path
      required: true
      description: 기록 관계 식별자
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"[0-9]+"$'}
    HandoverId:
      name: handoverId
      in: path
      required: true
      description: 인수인계 식별자
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
    ItemId:
      name: itemId
      in: path
      required: true
      description: 인수인계 항목 식별자
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: 조직 식별자
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
    UserId:
      name: userId
      in: path
      required: true
      description: 사용자 식별자
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
    MemberId:
      name: memberId
      in: path
      required: true
      description: 프로젝트 구성원 배정 식별자
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
    Limit:
      name: limit
      in: query
      required: false
      description: 한 번에 가져올 최대 건수
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: 건너뛸 건수
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    Cursor:
      name: cursor
      in: query
      required: false
      description: 마지막 정렬 키와 ID를 담은 불투명 base64url cursor. nonzero offset과 함께 사용할 수 없다.
      schema:
        type: string
        maxLength: 1000

  responses:
    BadRequest:
      description: 입력값이 올바르지 않다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 인증되지 않은 요청이다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 권한이 없다. 기록 내용은 노출하지 않고 접근 시도만 남긴다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 대상을 찾을 수 없다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 현재 상태에서 수행할 수 없는 요청이다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ReferenceConflict:
      description: |
        다른 데이터가 이 대상을 참조하고 있어 삭제할 수 없다.
        무엇이 참조하는지 references에 담아 관리자가 비활성화로 전환할지 판단하게 한다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ReferenceConflictProblem'

    TooManyRequests:
      description: 호출 한도를 초과했다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: ETag 버전이 현재 행과 다르다.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    PreconditionRequired:
      description: If-Match 헤더가 필요하다. code는 IF_MATCH_REQUIRED다.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    PayloadTooLarge:
      description: 요청 본문이 1 MiB를 넘는다(C01). code는 PAYLOAD_TOO_LARGE다.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    UnsupportedMediaType:
      description: 요청 본문이 application/json이 아니다.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    NotAcceptable:
      description: 지원하지 않는 Accept 값이다.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    ServiceUnavailable:
      description: 작업 큐가 포화됐거나(code=QUEUE_FULL, Retry-After=30) 필수 내부 서비스가 일시적으로 사용할 수 없다.
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    InternalServerError:
      description: 예상하지 못한 서버 오류다. code=INTERNAL_ERROR와 traceId만 싣고, 예외 메시지·스택·SQL·원문은 싣지 않는다.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}

  schemas:

    SignInRequest:
      type: object
      additionalProperties: false
      required: [employeeNo, password]
      properties:
        employeeNo:
          type: string
          description: 사내 계정 ID
          minLength: 1
        password:
          type: string
          format: password
          description: 사내 계정 비밀번호. 서버는 해시로만 대조하고 원문을 저장하지 않는다.
          minLength: 1

    SetCredentialRequest:
      type: object
      additionalProperties: false
      required: [employeeNo, token, newPassword]
      properties:
        employeeNo:
          type: string
          description: 사내 계정 ID
          minLength: 1
          maxLength: 64
        token:
          type: string
          description: 관리자에게서 받은 일회용 설정 코드
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          format: password
          description: 새 비밀번호. 12~128자이고 사번과 달라야 한다. 서버는 해시로만 저장한다.
          minLength: 12
          maxLength: 128

    CredentialToken:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
          description: 일회용 설정 코드(base64url, 43자). 이 응답에서만 볼 수 있다.
        expiresAt:
          type: string
          format: date-time
          description: 코드가 만료되는 시각

    Problem:
      type: object
      description: RFC 7807 형식의 공통 오류 응답
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
          description: 오류 유형 식별자
        title:
          type: string
          description: 사람이 읽는 짧은 요약
        status:
          type: integer
          description: HTTP 상태 코드
        detail:
          type: string
          description: 이 요청에 한정된 설명
        instance:
          type: string
          format: uri-reference
          description: 오류가 발생한 경로
        errors:
          type: array
          description: 입력값 오류의 필드별 목록
          items:
            $ref: '#/components/schemas/FieldError'
        code:
          type: string
        traceId:
          type: string

    ReferenceConflictProblem:
      description: 참조가 남아 삭제가 거부된 경우의 오류 응답
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [references]
          properties:
            references:
              type: array
              description: 삭제를 막고 있는 참조. 비어 있으면 삭제가 가능했다는 뜻이다.
              items:
                $ref: '#/components/schemas/BlockingReference'

    BlockingReference:
      type: object
      description: 삭제 대상을 참조하는 데이터의 종류와 건수
      required: [resource, count]
      properties:
        resource:
          type: string
          description: 참조하는 데이터의 종류(예 work_records, project_members, 사용자 삭제의 audit_events는 그 사용자가 행위자인 감사 행)
          example: work_records
        count:
          type: integer
          description: 참조하는 행의 수
          example: 12
        hint:
          type: string
          description: 관리자가 취할 수 있는 다음 행동
          example: 비활성화로 전환하면 기록의 근거를 유지한 채 목록에서 감춘다.


        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'


  /projects/{projectId}/handovers:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [handovers]
      operationId: listHandovers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      summary: 프로젝트의 인수인계 목록 조회
      description: 신규 담당자에게 배정된 인수인계가 없으면 빈 목록을 반환한다.
      responses:
        '200':
          description: 인수인계 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [handovers]
      operationId: requestHandover
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      summary: 담당자 교체 요청과 패키지 생성 접수
      description: |
        FR-10·FR-11. 프로젝트 관리자만 호출할 수 있다. 구성원이지만 관리자가 아니면 403, 비구성원은 404다.
        생성은 비동기이므로 202로 접수하고 Location 헤더가 상태 조회 경로를 가리킨다.
        scope에 든 확정 기록이 5,000건을 넘으면 409 SCOPE_TOO_LARGE로 거절하고 아무것도 저장하지 않는다(C05).
        scopeFrom이 scopeTo보다 늦거나 scopeRecordTypes가 비었거나 알 수 없는 유형이면 400이다.
        outgoingOwnerId·incomingOwnerId가 이 프로젝트의 현재 구성원이 아니면 400이고 errors에 그 필드 이름이 담긴다
        (요청자는 이미 프로젝트를 볼 수 있으므로 404로 숨기지 않는다). 두 담당자가 같은 사람이어도 400(incomingOwnerId)이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHandoverRequest'
      responses:
        '202':
          description: 생성 접수. 상태는 조회 경로에서 확인한다.
          headers:
            Location:
              description: 생성 상태를 조회할 경로
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Handover'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /handovers/{handoverId}:
    parameters:
      - $ref: '#/components/parameters/HandoverId'
    get:
      tags: [handovers]
      operationId: getHandover
      summary: 인수인계 상태와 패키지 요약 조회
      description: |
        S08의 진행률·포함 건수와 충돌 목록, S09의 패키지 개요를 함께 반환한다. 기간 안의 미확정 초안은
        unconfirmedRecords로 경고한다.
        상태가 FAILED이면 failureReason이 채워진다: INSUFFICIENT_EVIDENCE(근거 부족), MAX_ATTEMPTS_EXCEEDED(재시도 소진),
        DEADLINE_EXCEEDED(2시간 기한 초과), GENERATION_ABANDONED(패키지 job이 실패 사유 없이 사라진 경우의 대체 값).
        워커가 패키지 job을 가져가면 상태는 GENERATING이고, 이때도 version이 오른다.
      responses:
        '200':
          description: 인수인계 상세
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'


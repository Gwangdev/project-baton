        accountActivity:
          type: array
          maxItems: 5
          description: |
            본인 계정에 일어난 보안 관련 일의 최근 5건(최신순). 본인의 로그인(`SIGN_IN`)과 본인이 대상인 설정 코드 발급·설정
            (`ISSUE_CREDENTIAL_TOKEN`, `SET_CREDENTIAL`), 운영자가 시스템 관리자의 비밀번호를 재설정한 일(`RESET_SYSTEM_ADMIN_CREDENTIAL`, 요청 주소 없음)이다. 모르는 주소가 보이면 관리자에게 알린다. 메일 같은 바깥 채널은 없어
            로그인할 수 있는 사람에게만 보인다. 남의 활동은 담기지 않는다.
          items:
            type: object
            required: [action, occurredAt]
            properties:
              action:
                type: string
                enum: [SIGN_IN, ISSUE_CREDENTIAL_TOKEN, SET_CREDENTIAL, RESET_SYSTEM_ADMIN_CREDENTIAL]
              occurredAt:
                type: string
                format: date-time
              remoteAddress:
                type: string
                nullable: true
                maxLength: 64
                description: 요청이 온 주소. 기록되지 않은 행은 null이고, 보존 스위치를 켠 운영에서는 24개월이 지난 로그인의 주소도 비워져 null이다(행은 남는다)


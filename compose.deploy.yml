# 공개 데모 배포(work-orders D7): EC2 호스트 하나에서 compose.yml 위에 얹는다.
#  docker compose --env-file <deploy env> -f compose.yml -f compose.deploy.yml up -d --no-build
# - 이미지는 CI가 올리는 registry에서 온다(BATON_IMAGE_PREFIX, BATON_IMAGE_TAG). 호스트에서는 아무것도 빌드하지
# 않는다.
# - DB 계정을 나눈다(결정 11). migrate는 소유자로 한 번 돌고 끝나며, 앱은 아무것도 소유하지 않아 감사 트리거(V21)를 끌
# 수 없는 baton_app으로 접속한다. 소유자 비밀번호는 db와 migrate에만 간다.
# - 매일 초기화가 기준 덤프로 되돌려서 백업은 방문자의 변경만 남기므로, 데모는 백업하지 않는다. 야간 백업(compose.yml,
# backup 프로필)은 자기 저장소와 키를 가진 실제 배포용이다.
# - 공개 서비스는 프록시뿐이고 80과 443에서, Let's Encrypt 인증서를 named volume에 둔다.
# - 한도는 스왑 2 GiB가 있는 2 GiB 호스트에 맞춘다(결정 9). 오래 도는 서비스는 모두 호스트와 함께 다시 뜬다.
#  필수: BATON_DB_PASSWORD(소유자), BATON_DB_APP_PASSWORD, BATON_DB_INSPECT_PASSWORD, BATON_SITE_ADDRESS.

x-restart: &restart unless-stopped

services:
  db:
    restart: *restart
    environment:
      BATON_DB_APP_PASSWORD: ${BATON_DB_APP_PASSWORD:?BATON_DB_APP_PASSWORD is required}
      BATON_DB_INSPECT_PASSWORD: ${BATON_DB_INSPECT_PASSWORD:?BATON_DB_INSPECT_PASSWORD is required}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "effective_cache_size=384MB"]
    volumes:
      # 첫 기동 때만: baton_app과 baton_inspect를 만든다(infra/db/init/10-roles.sh).
      - type: bind
        source: ./infra/db/init
        target: /docker-entrypoint-initdb.d
        read_only: true
    mem_limit: 640m

  migrate:
    image: ${BATON_IMAGE_PREFIX:-project-baton}/app:${BATON_IMAGE_TAG:-local}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    entrypoint: ["java", "-Djava.io.tmpdir=/tmp", "-Dloader.main=com.projectbaton.config.DatabaseMigration",
                 "-cp", "/app/app.jar", "org.springframework.boot.loader.launch.PropertiesLauncher"]
    environment:
      BATON_DB_URL: jdbc:postgresql://db:5432/baton
      BATON_DB_MIGRATION_USERNAME: baton
      BATON_DB_MIGRATION_PASSWORD: ${BATON_DB_PASSWORD:?BATON_DB_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
    restart: "no"
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: !reset null
    image: ${BATON_IMAGE_PREFIX:-project-baton}/app:${BATON_IMAGE_TAG:-local}
    restart: *restart
    environment:
      BATON_DB_USERNAME: baton_app
      BATON_DB_PASSWORD: ${BATON_DB_APP_PASSWORD:?BATON_DB_APP_PASSWORD is required}
      SPRING_FLYWAY_ENABLED: "false"
    depends_on: !override
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 900m

  proxy:
    build: !reset null
    image: ${BATON_IMAGE_PREFIX:-project-baton}/proxy:${BATON_IMAGE_TAG:-local}
    restart: *restart
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.prod", "--adapter", "caddyfile"]
    environment:
      BATON_SITE_ADDRESS: ${BATON_SITE_ADDRESS:?BATON_SITE_ADDRESS is required}
    tmpfs: !override
      - /config:uid=10002,gid=10002
    ports: !override
      - "${BATON_HTTP_PORT:-80}:80"
      - "${BATON_HTTPS_PORT:-443}:443"
    volumes: !override
      - proxy-data:/data
    mem_limit: 128m

volumes:
  proxy-data: {}

# 관측 overlay: docker compose -f compose.yml -f compose.observe.yml up -d
# 부하 overlay와 함께 쓰려면 -f tests/load/compose.load.yml -f tests/load/compose.load-observe.yml을 더한다. 그러면
# BATON_LOAD_PROMETHEUS=1일 때 부하 도구가 k6의 metric을 Prometheus로 보낸다(tests/load/run.sh).
# - metric만: Prometheus가 수집하고 경보 규칙을 평가하고, Grafana가 대시보드 셋을 보이고, postgres_exporter가 DB
# 통계를 읽는다. Slack이나 메일 알림은 외부 전송(승인 없이는 금지)이라서 경보는 보여 주기만 하고 보내지 않는다.
# - 컨테이너 CPU는 없다. cAdvisor는 Docker Desktop에서 읽기 전용 호스트 mount로 Docker daemon을 찾지 못하고, Docker
# socket을 주면 Docker API 전체를 주게 된다. 앱의 CPU는 자기 프로세스 metric에서, DB 컨테이너의 CPU는 부하 도구의
# 표본(tests/load/sample.sh)에서 온다.
# - 로컬과 부하 시험용. 운영 배포는 대신 회사 모니터링에 붙인다(가정 A-14).
# - Grafana는 127.0.0.1에만 열고 관리자 비밀번호가 필요하다. Prometheus는 열지 않는다.
#  필수: BATON_GRAFANA_ADMIN_PASSWORD, BATON_MONITOR_DB_PASSWORD(둘 다 ~/baton-secrets/observe.env에 둔다).
services:
  app:
    networks:
      - observe

  # 읽기 전용 모니터링 계정(pg_monitor: 통계 view, 업무 테이블 없음)을 만들거나 고친 뒤 끝난다. 비밀번호는 psql 안에서
  # 환경으로 읽어서 명령줄에 나오지 않는다.
  monitor-init:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:uid=999,gid=999
    environment:
      PGHOST: db
      PGUSER: baton
      PGDATABASE: baton
      PGPASSWORD: ${BATON_DB_PASSWORD:?BATON_DB_PASSWORD is required}
      MONITOR_PASSWORD: ${BATON_MONITOR_DB_PASSWORD:?BATON_MONITOR_DB_PASSWORD is required}
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -X -q -v ON_ERROR_STOP=1 <<'SQL'
        \getenv monitor_password MONITOR_PASSWORD
        SELECT 'CREATE ROLE baton_monitor LOGIN' WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'baton_monitor') \gexec
        SELECT format('ALTER ROLE baton_monitor LOGIN PASSWORD %L', :'monitor_password') \gexec
        GRANT pg_monitor TO baton_monitor;
        SQL
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - data
    cpus: 0.25
    mem_limit: 64m
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    user: "65534:65534"
    read_only: true
    environment:
      DATA_SOURCE_URI: db:5432/baton?sslmode=disable
      DATA_SOURCE_USER: baton_monitor
      DATA_SOURCE_PASS: ${BATON_MONITOR_DB_PASSWORD:?BATON_MONITOR_DB_PASSWORD is required}
    depends_on:
      monitor-init:
        condition: service_completed_successfully
    networks:
      - data
      - observe
    cpus: 0.25
    mem_limit: 64m
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    user: "65534:65534"
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      # 부하 실행 중 k6가 metric을 여기로 보낸다(tests/load/run.sh, BATON_LOAD_PROMETHEUS=1).
      - --web.enable-remote-write-receiver
    volumes:
      - ./infra/observe/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
    # 내부 observe 네트워크만. 앱의 관리 포트, exporter, Grafana가 거기 있고, 관측 실행에서는 부하 생성기가
    # 붙는다(tests/load/compose.load-observe.yml). remote-write 수신기에는 인증이 없어서 그 네트워크 밖에서는 닿을 수
    # 없게 한다.
    networks:
      - observe
    cpus: 1
    mem_limit: 1g
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    user: "472:0"
    read_only: true
    tmpfs:
      - /tmp:uid=472,gid=0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${BATON_GRAFANA_ADMIN_PASSWORD:?BATON_GRAFANA_ADMIN_PASSWORD is required}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Grafana는 기본으로 외부에 신호를 보내고 인터넷에서 plugin을 설치하는데, 이 배포는 아무것도 밖으로 보내지
      # 않는다.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./infra/observe/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observe/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${BATON_GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - observe
      - observe-ui
    cpus: 0.5
    mem_limit: 256m
    logging: *logging

networks:
  observe:
    internal: true
  # Grafana의 공개 포트에는 내부가 아닌 네트워크가 필요하다.
  observe-ui: {}

volumes:
  prometheus-data: {}
  grafana-data: {}

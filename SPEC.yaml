# 공개 API 표면: 백엔드가 내주는 모든 endpoint이고, 그 밖의 것은 없다.
#
# 목록은 설계와 함께 정하고, 코드에 맞추려고가 아니라 설계 결정으로만 바꾼다. tools/check_backend_contract.py가
# ProjectBaton-API.yml과 대조한다(양쪽의 모든 경로와 메서드). 개발 과정에서는 개발 기록과 함께 둔 정적 검사로 코드가
# 선언한 endpoint와도 비교해서, 여기 있는데 코드에 없거나 코드에 있는데 여기 없는 endpoint는 실패한다.
#
# 비교할 때 경로 변수 이름은 무시한다({id}와 {orderId}는 같다). 이름은 사람이 읽으라고 붙인다.

version: 1

# 커밋 직전에 `gate.py --commit`이 돌린다. 시험 파일이 있는 것(T1)과 시험이 통과하는 것은 다른 사실이다. 빼면 게이트가
# 대신 경고한다.
test_command: "./backend/gradlew -p backend clean build"

# 서비스 자체 코드가 있는 곳. 밖에 있는 것은 공개 표면으로 세지 않는다. 빼면 저장소 전체를 훑고, 기존 프로젝트에는
# 영향이 없다.
#
# 저장소에 서비스 표면이 아닌 코드(예제 프로젝트, 채점·시험 fixture, monorepo의 다른 서비스)도 있을 때 쓴다. 그렇지
# 않으면 그 controller가 S4(과잉)로 나온다. 그런 것을 `exclude`에 넣지 않는다. 그 목록은 「우리 표면이지만 일부러
# 관리하지 않는 것」이라 항목마다 이유를 담는데, 「아예 우리 코드가 아닌 것」을 섞으면 둘을 구분할 수 없고 fixture를
# 더할 때마다 목록이 늘어난다.
#
code_roots:
  - frontend/src        # 1단계 산출물. 2단계에서 backend/src/main을 추가한다.
  - backend/src/main/java

# 컬렉션 전체를 대상으로 하는 PUT/DELETE는 한 번의 오작동으로 데이터셋을 지운다.
# `gate.py`가 A4로 막고, 정말 필요하면 항목에 사유를 달아 의도를 남긴다.
#
#   - endpoint: DELETE /api/sessions
#     reason: 만료 세션 일괄 정리 — 관리자 권한·감사 로그 적용
#
# exclude와 혼동하지 않는다. exclude는 명세 관리 밖의 경로용이고, 거기 적으면
# S3·S4 대조에서도 함께 빠진다.


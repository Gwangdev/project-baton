exclude:
  # 명세 관리 밖의 경로(프레임워크가 주는 endpoint 등)에만 쓴다. 이유를 반드시 적는다. 이유 없는 exclude는 비교를
  # 끈다.
  - endpoint: GET /actuator/health/liveness
    reason: Spring Boot Actuator가 내부 관리 포트에서 제공하는 프로세스 생존 상태
  - endpoint: GET /actuator/health/readiness
    reason: Spring Boot Actuator가 내부 관리 포트에서 제공하는 DB 준비 상태
  - endpoint: GET /actuator/prometheus
    reason: Spring Boot Actuator와 Micrometer가 내부 관리 포트에서 제공하는 지표
  - endpoint: GET /error
    reason: 서블릿 컨테이너의 오류 dispatch 대상. 업무 API가 아니며 ProblemErrorController가 필터·방화벽·컨테이너 오류를 C01 Problem으로 렌더링한다. 오류 dispatch는 실패한 요청의 메서드를 유지하므로 API가 쓰는 다섯 메서드를 모두 받는다. 직접 요청은 401 또는 404만 받는다
  - endpoint: POST /error
    reason: 서블릿 컨테이너의 오류 dispatch 대상. 업무 API가 아니며 ProblemErrorController가 필터·방화벽·컨테이너 오류를 C01 Problem으로 렌더링한다. 오류 dispatch는 실패한 요청의 메서드를 유지하므로 API가 쓰는 다섯 메서드를 모두 받는다. 직접 요청은 401 또는 404만 받는다
  - endpoint: PUT /error
    reason: 서블릿 컨테이너의 오류 dispatch 대상. 업무 API가 아니며 ProblemErrorController가 필터·방화벽·컨테이너 오류를 C01 Problem으로 렌더링한다. 오류 dispatch는 실패한 요청의 메서드를 유지하므로 API가 쓰는 다섯 메서드를 모두 받는다. 직접 요청은 401 또는 404만 받는다
  - endpoint: PATCH /error
    reason: 서블릿 컨테이너의 오류 dispatch 대상. 업무 API가 아니며 ProblemErrorController가 필터·방화벽·컨테이너 오류를 C01 Problem으로 렌더링한다. 오류 dispatch는 실패한 요청의 메서드를 유지하므로 API가 쓰는 다섯 메서드를 모두 받는다. 직접 요청은 401 또는 404만 받는다
  - endpoint: DELETE /error
    reason: 서블릿 컨테이너의 오류 dispatch 대상. 업무 API가 아니며 ProblemErrorController가 필터·방화벽·컨테이너 오류를 C01 Problem으로 렌더링한다. 오류 dispatch는 실패한 요청의 메서드를 유지하므로 API가 쓰는 다섯 메서드를 모두 받는다. 직접 요청은 401 또는 404만 받는다
